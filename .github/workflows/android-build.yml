name: Build RoutePilot Driver APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare .env from .env.example if not present
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload RoutePilot Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-Driver-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
