name: Build RoutePilot Driver APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Generate debug.keystore if not present
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env from GitHub Secrets
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
          PLACES_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          echo "MAPS_API_KEY=${MAPS_KEY:-YOUR_GOOGLE_MAPS_API_KEY}" > .env
          echo "PLACES_API_KEY=${PLACES_KEY:-YOUR_GOOGLE_PLACES_API_KEY}" >> .env

      - name: Ensure google-services.json exists for CI build
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "246133316631",
              "project_id": "gen-lang-client-0396467346",
              "storage_bucket": "gen-lang-client-0396467346.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:246133316631:android:bbdc804ac05dc974141052",
                  "android_client_info": {
                    "package_name": "com.aistudio.routepilot.drvnav"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "246133316631-qf0cnl6vn1essjqei93uvebkgn82n4f5.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCTEGO4DpThrOSrisuEQkHDrdf805jmtFw"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "246133316631-qf0cnl6vn1essjqei93uvebkgn82n4f5.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug -x lint

      - name: Upload RoutePilot Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-Driver-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
