name: Build RoutePilot Driver APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Generate debug.keystore if not present
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env from GitHub Secrets
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
          PLACES_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          echo "MAPS_API_KEY=${MAPS_KEY:-YOUR_GOOGLE_MAPS_API_KEY}" > .env
          echo "PLACES_API_KEY=${PLACES_KEY:-YOUR_GOOGLE_PLACES_API_KEY}" >> .env

      - name: Build Debug APK
        run: gradle assembleDebug -x lint

      - name: Upload RoutePilot Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-Driver-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
